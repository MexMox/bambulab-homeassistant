name: Bambu Lab Bridge
version: "1.5.0"
slug: bambu_bridge
description: >-
  Bambu-Lab-Drucker (P1, A1, X1, P2, H2) lokal mit Home Assistant verbinden –
  Status, Kamera, AMS, Steuerung, 3D-Vorschau und eigene Dashboard-Karte.
  Ohne Cloud, ohne HACS.
url: https://github.com/DEIN-GITHUB-NAME/bambu-p1s-homeassistant
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
services:
  - mqtt:need
homeassistant_api: true
map:
  - homeassistant_config:rw
ingress: true
ingress_port: 8099
panel_icon: mdi:printer-3d
panel_title: 3D-Drucker
options:
  log_level: info
  install_card: true
  printers:
    - name: P1S
      model: P1S
      host: ""
      serial: ""
      access_code: ""
      camera: true
      preview: true
schema:
  log_level: list(debug|info|warning|error)
  install_card: bool
  printers:
    - name: str
      model: list(P1S|P1P|A1|A1MINI|X1|X1C|X1E|P2S|H2S|H2D|H2DPRO|H2C|OTHER)
      host: str
      serial: str
      access_code: password
      camera: bool?
      camera_mode: list(auto|chamber|rtsp)?
      camera_interval: int(1,60)?
      preview: bool?
      last_print_light: bool?
      last_print_delay: int(0,120)?
      pushall_interval: int(60,3600)?
      allow_gcode: bool?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
